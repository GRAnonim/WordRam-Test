  <rect width="600" height="240" rx="32" fill="#0E1116"/>
  <!-- WR Monogram -->
  <text x="60" y="160" font-family="'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="120" font-weight="900" fill="#FFFFFF">W</text>
  <text x="185" y="160" font-family="'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="120" font-weight="900" fill="#F2C94C">R</text>
  
  <!-- Divider -->
