  <text x="328" y="170" font-family="'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#E6E6E6" letter-spacing="6">ИГРА В СЛОВА</text>
