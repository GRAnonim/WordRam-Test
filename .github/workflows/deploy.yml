name: Deploy WordRam to TimeWeb

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Deploy to TimeWeb
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Sync files to TimeWeb
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /wordram/public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/.vscode/**
            **/.cursor/**
            **/scripts/**
            **/test*/**
            **/test*.mjs
            **/README.md
