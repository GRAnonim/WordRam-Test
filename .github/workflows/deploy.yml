name: Deploy WordRam to TimeWeb

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Deploy to TimeWeb
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Write Yandex config
        env:
          YANDEX_CLIENT_ID: ${{ secrets.YANDEX_CLIENT_ID }}
          YANDEX_CLIENT_SECRET: ${{ secrets.YANDEX_CLIENT_SECRET }}
        run: python3 -c 'import os; from pathlib import Path; Path("api/yandex-config.php").write_text("<?php\nreturn [\n    \"client_id\" => " + repr(os.environ.get("YANDEX_CLIENT_ID", "")) + ",\n    \"client_secret\" => " + repr(os.environ.get("YANDEX_CLIENT_SECRET", "")) + ",\n    \"redirect_uri\" => \"https://wordram.ru/api/yandex-callback.php\",\n];\n")'

      - name: Sync files to TimeWeb
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /wordram/public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/.vscode/**
            **/.cursor/**
            **/scripts/**
            **/test*/**
            **/test*.mjs
            **/README.md
