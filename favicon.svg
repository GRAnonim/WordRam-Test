<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a3545"/>
      <stop offset="50%" stop-color="#342330"/>
      <stop offset="100%" stop-color="#1e141d"/>
    </linearGradient>
    <linearGradient id="tileGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#9333ea" stop-opacity="0"/>
    </linearGradient>
    <filter id="tileShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Shield -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#bgGrad)" stroke="#6b4c63" stroke-width="8"/>
  <circle cx="256" cy="256" r="180" fill="url(#glowGrad)"/>
  
  <!-- 3D Tile 1 (Left - 'W') -->
  <g filter="url(#tileShadow)" transform="translate(100, 140) rotate(-6)">
    <!-- Base Shadow -->
    <rect x="0" y="14" width="140" height="140" rx="30" fill="#a89a9f"/>
    <!-- Top Face -->
    <rect x="0" y="0" width="140" height="140" rx="30" fill="#ffffff" stroke="#e2d9e0" stroke-width="4"/>
    <!-- Letter W -->
    <text x="70" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="84" font-weight="900" fill="#9333ea" text-anchor="middle">W</text>
  </g>

  <!-- 3D Tile 2 (Right - 'R') -->
  <g filter="url(#tileShadow)" transform="translate(250, 190) rotate(8)">
    <!-- Base Shadow -->
    <rect x="0" y="14" width="140" height="140" rx="30" fill="#ca8a04"/>
    <!-- Top Face -->
    <rect x="0" y="0" width="140" height="140" rx="30" fill="url(#tileGold)" stroke="#facc15" stroke-width="4"/>
    <!-- Letter R -->
    <text x="70" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="84" font-weight="900" fill="#713f12" text-anchor="middle">R</text>
  </g>
  
  <!-- Subtitle Tag -->
  <rect x="136" y="390" width="240" height="44" rx="22" fill="#2d1c28" stroke="#a855f7" stroke-width="3"/>
  <text x="256" y="419" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#fde047" text-anchor="middle" letter-spacing="1">WORDRAM</text>
</svg>
